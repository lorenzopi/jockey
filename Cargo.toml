[package]
name = "jockey"
version = "0.1.0"
edition = "2024"
description = "One saddle, many coding agents: a TUI that orchestrates Codex, Claude Code and Grok"
license = "MIT"
repository = "https://github.com/lorenzopi/jockey"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2.191"
ratatui = "0.30.2"
reflink-copy = "0.1.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
unicode-width = "0.2.3"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
